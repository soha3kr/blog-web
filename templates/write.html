<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>새 글 쓰기 - 나의 블로그</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
            background-color: #f8fafc;
            color: #1e293b;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between selection:bg-emerald-100 selection:text-emerald-800">

    <header class="sticky top-0 z-50 bg-white/80 backdrop-blur-md border-b border-slate-100 shadow-xs">
        <div class="max-w-4xl mx-auto px-6 h-16 flex items-center justify-between">
            <a href="/" class="text-xl font-bold tracking-tight text-emerald-800 flex items-center gap-2">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 20H5a2 2 0 01-2-2V6a2 2 0 012-2h10a2 2 0 012 2v1m2 13a2 2 0 01-2-2V7m2 13a2 2 0 002-2V9a2 2 0 00-2-2h-2m-4-3H9M7 16h6M7 8h6v4H7V8z"/></svg>
                나의 블로그
            </a>
            <nav class="flex items-center gap-4">
                <a href="/" class="text-sm font-medium text-slate-600 hover:text-emerald-700 transition-colors">홈으로</a>
            </nav>
        </div>
    </header>

    <main class="flex-grow max-w-3xl w-full mx-auto px-6 py-12">
        
        <div class="mb-8">
            <a href="/" class="inline-flex items-center gap-2 text-sm font-semibold text-emerald-700 hover:text-emerald-800 bg-emerald-50 hover:bg-emerald-100/60 px-4 py-2 rounded-xl transition-all">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"/></svg>
                글 목록으로 돌아가기
            </a>
        </div>

        <div class="bg-white rounded-3xl p-8 sm:p-12 shadow-sm border border-slate-100/80">
            
            <header class="border-b border-slate-100 pb-6 mb-8">
                <h1 class="text-2xl sm:text-3xl font-extrabold text-slate-900 tracking-tight">
                    새 글 쓰기
                </h1>
                <p class="text-sm text-slate-400 mt-1">블로그에 공유할 새로운 이야기를 작성해보세요.</p>
            </header>

            <form method="post">
                <div class="mb-6">
                    <label class="block text-sm font-semibold text-slate-700 mb-2">제목</label>
                    <input type="text" name="title" placeholder="제목을 입력하세요" required class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-2xl text-slate-900 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-emerald-500/20 focus:border-emerald-600 transition-all">
                </div>

                <div class="mb-8">
                    <label class="block text-sm font-semibold text-slate-700 mb-2">내용</label>
                    <textarea name="content" placeholder="내용을 입력하세요" required class="w-full min-h-[350px] px-4 py-3 bg-slate-50 border border-slate-200 rounded-2xl text-slate-900 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-emerald-500/20 focus:border-emerald-600 transition-all resize-y"></textarea>
                </div>

                <div class="flex items-center justify-end gap-3 pt-4 border-t border-slate-100">
                    <a href="/" class="px-5 py-3 rounded-xl text-sm font-semibold text-slate-600 hover:text-slate-800 bg-slate-100 hover:bg-slate-200 transition-all">취소</a>
                    <button type="submit" class="px-6 py-3 rounded-xl text-sm font-semibold text-white bg-emerald-700 hover:bg-emerald-800 shadow-sm transition-all cursor-pointer">저장하기</button>
                </div>
            </form>

        </div>
    </main>

    <footer class="bg-white border-t border-slate-100 py-8 mt-16 text-center text-sm text-slate-400">
        <div class="max-w-4xl mx-auto px-6">
            <p>&copy; 나의 블로그. All rights reserved.</p>
        </div>
    </footer>

</body>
</html>
