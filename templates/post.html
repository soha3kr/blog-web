<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ post.title }} - 블로그</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
            background-color: #f8fafc;
            color: #1e293b;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between selection:bg-emerald-100 selection:text-emerald-800">

    <header class="sticky top-0 z-50 bg-white/80 backdrop-blur-md border-b border-slate-100 shadow-xs">
        <div class="max-w-4xl mx-auto px-6 h-16 flex items-center justify-between">
            <a href="/" class="text-xl font-bold tracking-tight text-emerald-800 flex items-center gap-2">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 20H5a2 2 0 01-2-2V6a2 2 0 012-2h10a2 2 0 012 2v1m2 13a2 2 0 01-2-2V7m2 13a2 2 0 002-2V9a2 2 0 00-2-2h-2m-4-3H9M7 16h6M7 8h6v4H7V8z"/></svg>
                나의 블로그
            </a>
            <nav class="flex items-center gap-4">
                <a href="/" class="text-sm font-medium text-slate-600 hover:text-emerald-700 transition-colors">홈으로</a>
            </nav>
        </div>
    </header>

    <main class="flex-grow max-w-3xl w-full mx-auto px-6 py-12">
        
        <div class="mb-8">
            <a href="/" class="inline-flex items-center gap-2 text-sm font-semibold text-emerald-700 hover:text-emerald-800 bg-emerald-50 hover:bg-emerald-100/60 px-4 py-2 rounded-xl transition-all">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"/></svg>
                글 목록으로 돌아가기
            </a>
        </div>

        <article class="bg-white rounded-3xl p-8 sm:p-12 shadow-sm border border-slate-100/80">
            
            <header class="border-b border-slate-100 pb-8 mb-8">
                <div class="flex items-center gap-2 text-xs font-semibold text-emerald-700 uppercase tracking-wider mb-3">
                    <span>블로그 포스트</span>
                </div>
                <h1 class="text-2xl sm:text-4xl font-extrabold text-slate-900 tracking-tight leading-tight mb-4">
                    {{ post.title }}
                </h1>
                <div class="flex items-center gap-3 text-sm text-slate-400">
                    <span class="inline-flex items-center gap-1">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg>
                        {{ post.created_at }}
                    </span>
                </div>
            </header>

            <div class="content text-slate-700 text-base sm:text-lg leading-relaxed whitespace-pre-wrap font-normal">
                {{ post.content }}
            </div>

            <div class="mt-12 pt-8 border-t border-slate-100 flex items-center justify-between">
                <a href="/" class="inline-flex items-center gap-2 text-sm font-medium text-slate-600 hover:text-emerald-700 transition-colors">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/></svg>
                    목록으로
                </a>
                <button onclick="window.scrollTo({top: 0, behavior: 'smooth'});" class="inline-flex items-center gap-1.5 text-xs font-semibold text-slate-500 hover:text-slate-800 bg-slate-50 hover:bg-slate-100 px-3 py-2 rounded-lg transition-colors cursor-pointer">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 10l7-7m0 0l7 7m-7-7v18"/></svg>
                    맨 위로
                </button>
            </div>

        </article>
    </main>

    <footer class="bg-white border-t border-slate-100 py-8 mt-16 text-center text-sm text-slate-400">
        <div class="max-w-4xl mx-auto px-6">
            <p>&copy; 나의 블로그. All rights reserved.</p>
        </div>
    </footer>

</body>
</html>
